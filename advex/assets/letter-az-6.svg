<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1188" viewBox="0 0 840 1188"><rect width="840" height="1188" fill="white"/><rect x="68" y="80" width="48" height="6" fill="#91a361"/><text x="68" y="132" font-family="Arial,sans-serif" font-size="17" letter-spacing="2" fill="#6d7959">SƏNƏD NÜMUNƏSİ / 06</text><line x1="68" y1="160" x2="772" y2="160" stroke="#d8dfcc"/><text x="68" y="266" font-family="Arial,sans-serif" font-size="34" fill="#26301f">Təşəkkür məktubu</text><text x="68" y="310" font-family="Arial,sans-serif" font-size="18" fill="#7a846d">Təsdiqlənmiş skan üçün yer</text><text x="68" y="405" font-family="Arial,sans-serif" font-size="20" fill="#515d43">Bu sənəd yalnız interaktiv prototipdə baxış</text><text x="68" y="439" font-family="Arial,sans-serif" font-size="20" fill="#515d43">və böyütmə funksiyasını göstərmək üçün yaradılıb.</text><text x="68" y="473" font-family="Arial,sans-serif" font-size="20" fill="#515d43"></text><text x="68" y="507" font-family="Arial,sans-serif" font-size="20" fill="#515d43">Orijinal məktub təqdim edildikdən və dərc</text><text x="68" y="541" font-family="Arial,sans-serif" font-size="20" fill="#515d43">hüquqları təsdiqləndikdən sonra onun skanı</text><text x="68" y="575" font-family="Arial,sans-serif" font-size="20" fill="#515d43">burada yerləşdiriləcək.</text><text x="68" y="609" font-family="Arial,sans-serif" font-size="20" fill="#515d43"></text><text x="68" y="643" font-family="Arial,sans-serif" font-size="20" fill="#515d43">Bu nümunədə təşkilatın adı, məktubun məzmunu,</text><text x="68" y="677" font-family="Arial,sans-serif" font-size="20" fill="#515d43">imza və möhür qəsdən göstərilməyib.</text><text x="68" y="711" font-family="Arial,sans-serif" font-size="20" fill="#515d43"></text><text x="68" y="745" font-family="Arial,sans-serif" font-size="20" fill="#515d43">Bu, müştəri rəyi deyil və ADVEX təcrübəsini</text><text x="68" y="779" font-family="Arial,sans-serif" font-size="20" fill="#515d43">və ya görülmüş işləri təsdiqləmir.</text><text x="420" y="930" text-anchor="middle" font-family="Arial,sans-serif" font-size="75" fill="#e6ecd9" letter-spacing="9">NÜMUNƏ</text><line x1="68" y1="1060" x2="772" y2="1060" stroke="#d8dfcc"/><text x="68" y="1100" font-family="Arial,sans-serif" font-size="14" fill="#7a846d">NÜMAYİŞ • REAL MÜŞTƏRİ RƏYİ DEYİL</text></svg>