<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1188" viewBox="0 0 840 1188"><rect width="840" height="1188" fill="white"/><rect x="68" y="80" width="48" height="6" fill="#91a361"/><text x="68" y="132" font-family="Arial,sans-serif" font-size="17" letter-spacing="2" fill="#6d7959">ОБРАЗЕЦ ДОКУМЕНТА / 04</text><line x1="68" y1="160" x2="772" y2="160" stroke="#d8dfcc"/><text x="68" y="266" font-family="Arial,sans-serif" font-size="34" fill="#26301f">Благодарственное письмо</text><text x="68" y="310" font-family="Arial,sans-serif" font-size="18" fill="#7a846d">Место для согласованного скана</text><text x="68" y="405" font-family="Arial,sans-serif" font-size="20" fill="#515d43">Этот документ создан только для демонстрации</text><text x="68" y="439" font-family="Arial,sans-serif" font-size="20" fill="#515d43">просмотра и увеличения изображения в прототипе.</text><text x="68" y="473" font-family="Arial,sans-serif" font-size="20" fill="#515d43"></text><text x="68" y="507" font-family="Arial,sans-serif" font-size="20" fill="#515d43">Здесь будет опубликован оригинальный скан</text><text x="68" y="541" font-family="Arial,sans-serif" font-size="20" fill="#515d43">благодарственного письма после получения</text><text x="68" y="575" font-family="Arial,sans-serif" font-size="20" fill="#515d43">материала и подтверждения права на публикацию.</text><text x="68" y="609" font-family="Arial,sans-serif" font-size="20" fill="#515d43"></text><text x="68" y="643" font-family="Arial,sans-serif" font-size="20" fill="#515d43">Название организации, содержание письма,</text><text x="68" y="677" font-family="Arial,sans-serif" font-size="20" fill="#515d43">подпись и печать в этом образце отсутствуют.</text><text x="68" y="711" font-family="Arial,sans-serif" font-size="20" fill="#515d43"></text><text x="68" y="745" font-family="Arial,sans-serif" font-size="20" fill="#515d43">Это не отзыв клиента и не подтверждение</text><text x="68" y="779" font-family="Arial,sans-serif" font-size="20" fill="#515d43">опыта или выполненных работ ADVEX.</text><text x="420" y="930" text-anchor="middle" font-family="Arial,sans-serif" font-size="75" fill="#e6ecd9" letter-spacing="9">ОБРАЗЕЦ</text><line x1="68" y1="1060" x2="772" y2="1060" stroke="#d8dfcc"/><text x="68" y="1100" font-family="Arial,sans-serif" font-size="14" fill="#7a846d">ДЕМОНСТРАЦИЯ • НЕ РЕАЛЬНЫЙ ОТЗЫВ</text></svg>